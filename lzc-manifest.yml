application:
  subdomain: artmuseum
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://art-history-museum:3000/
services:
  art-history-museum:
    # 镜像由 lzc-build.yml 的 images 配置从 upstream/ 源码构建并直接嵌入 LPK
    image: embed:art-history-museum
    # 镜像内以 node (uid 1000) 运行；以 root 启动保证 .next ISR 缓存目录可写
    user: root
