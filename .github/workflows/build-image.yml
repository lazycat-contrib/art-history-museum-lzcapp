# syntax=docker/dockerfile:1

# 构建上游 justdataplease/art-history-museum 的镜像并推送到 GHCR。
# 由本仓库的 publish workflow 通过 ghcr.io/lazycat-contrib/art-history-museum 交付到懒猫。
#
# 版本来自本仓库 package.yml 的 version 字段；当需要更新镜像时：
#   1. 更新 package.yml 的版本号并提交
#   2. 手动触发本 workflow（或等每日定时检查上游是否有新提交）

name: Build upstream image

on:
  schedule:
    # 每日检查上游是否有新提交（UTC 01:37 = 北京 09:37）
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if the image already exists"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-art-history-museum
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Read package version and upstream commit
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('package.yml'))['version'])")
          SHA=$(gh api repos/justdataplease/art-history-museum/commits/main --jq '.sha')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "package version = $VERSION / upstream main = $SHA"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image tag exists
        id: exists
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if docker manifest inspect "ghcr.io/${{ github.repository_owner }}/art-history-museum:v$VERSION" > /dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image v$VERSION already exists; skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream
        if: steps.exists.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: justdataplease/art-history-museum
          ref: ${{ steps.meta.outputs.sha }}
          path: upstream

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/art-history-museum:v${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/art-history-museum:latest
          labels: |
            org.opencontainers.image.source=https://github.com/justdataplease/art-history-museum
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Art History Museum image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream: \`justdataplease/art-history-museum@${{ steps.meta.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`ghcr.io/${{ github.repository_owner }}/art-history-museum:v${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rebuilt: ${{ steps.exists.outputs.exists != 'true' }}" >> "$GITHUB_STEP_SUMMARY"
