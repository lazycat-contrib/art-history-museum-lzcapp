name: Build and Publish (embedded image)

# 构建与发布完全交给 lazycat-github-action v1.3.0：
# - 在 GitHub runner 上用 docker buildx 从 upstream/ 源码构建镜像（lzc-build.yml 的 images:）
# - 镜像以完整 OCI 格式直接嵌入 LPK（lzc-manifest.yml 的 image: embed:...），不推送任何 registry
# - 发布 GitHub Release 资产（<package-id>-v<version>.lpk）并上架喵喵（私有）商店
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog for store publication"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      toolchains: docker
      versioned-release-asset: true
      changelog: ${{ inputs.changelog || format('Release {0}', github.run_number) }}
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
