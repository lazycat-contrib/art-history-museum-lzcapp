version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

# 版本来自本仓库 package.yml；镜像由 lzc-build.yml 从 upstream/ 源码构建并嵌入 LPK，
# 不经过任何镜像仓库，因此不需要镜像版本源。
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
build:
  run_buildscript: false
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Art History Museum
    summary: "可漫步的艺术史博物馆 —— 3D 画廊探索千余年绘画"
